name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: Prepare Linux AppImage staging
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          # linuxdeploy does not overwrite a partial AppDir left by a prior
          # bundle attempt. Clear only generated AppImage staging before each
          # release build so a retried job starts from the same state as CI.
          rm -rf "src-tauri/target/release/bundle/appimage" "src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
      - name: Prepare the pinned Linuxdeploy GTK helper
        if: startsWith(matrix.platform, 'ubuntu')
        run: node scripts/prepare-linuxdeploy-plugin.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: Change Recovery Ledger v__VERSION__
          releaseBody: Local checkpoints and selective recovery for agent changes. These v0.1 builds are unsigned unless signing secrets are configured.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Verify Linux installers
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          appimages=(src-tauri/target/**/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/**/bundle/deb/*.deb)
          rpms=(src-tauri/target/**/bundle/rpm/*.rpm)
          test "${#appimages[@]}" -eq 1
          test -s "${appimages[0]}"
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          dpkg-deb --info "${debs[0]}" >/dev/null

  linux-appimage-smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libfuse2 xvfb
      - name: Download and smoke-test the published AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          mkdir smoke-assets
          gh release download "$tag" --pattern '*.AppImage' --dir smoke-assets
          appimages=(smoke-assets/*.AppImage)
          test "${#appimages[@]}" -eq 1
          scripts/smoke-appimage.sh "${appimages[0]}"

  manifests:
    needs: [build, linux-appimage-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          mkdir release-assets
          gh release download "$tag" --dir release-assets
      - name: Write checksums and release manifest
        run: |
          tag="v$(node -p "require('./package.json').version")"
          cd release-assets
          rm -f SHA256SUMS latest.json
          sha256sum * > SHA256SUMS
          python3 ../scripts/release-manifest.py "$tag" > latest.json
      - name: Upload metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" release-assets/SHA256SUMS release-assets/latest.json --clobber
      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          mkdir verified-assets
          gh release download "$tag" --dir verified-assets --clobber
          gh release view "$tag" --json tagName,targetCommitish,assets > release.json
          python3 scripts/verify-release.py "$tag" "${GITHUB_SHA}" release.json verified-assets
