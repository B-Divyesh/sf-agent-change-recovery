[package]
name = "change-recovery-ledger"
version = "0.1.3"
description = "Local semantic checkpoints for agent changes"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "change_recovery_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

[dev-dependencies]
tempfile = "3.21"
